name: CI

# The checks that need no model and no secret: the gate against its own cheats,
# the golden set against its reference proofs, every pinned statement, and every
# proof accepted so far.

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Lean and fetch the Mathlib build
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
          use-mathlib-cache: "true"

      - name: Install the platform
        run: pip install -e '.[dev]'

      - name: Gate self-test (honest proofs accepted, cheats rejected)
        run: pytest -q

      - name: Every canary is rejected, each for its own reason
        run: ztproof canaries --summary

      - name: The golden set's reference proofs pass the gate
        run: ztproof golden

      - name: Every pinned statement elaborates
        run: ztproof check

      - name: Every accepted proof still passes the gate
        run: ztproof recheck
