# Context pack for the Harvard qualifying-examination questions (rung 5 of the
# training ladder). Written by the author's Cowork session (Claude) on 19 November
# 2026, and not yet reviewed by a person. The same for every attempt; never changed
# during a run. The compilation's written solutions are NOT given to the model.

problem:
  id: harvard-quals-algebra
  informal: >
    Eight questions set at Harvard's PhD qualifying examination between 1997 and 2020, in algebra and number theory: quadratic rings, finite fields and cyclic groups, small groups, irreducible polynomials, p-groups and primes in arithmetic progressions. They are independent of each other. Mathlib is imported, and it already holds some of the results in some form; a proof that cites the library is a proof, and the report will show it for what it is.
  level: "rung 5 of 5, PhD qualifying examination"
  field: "algebra and number theory"
  source: "Harvard University PhD qualifying examinations, 1997-2020"

library: Ladder            # the namespace of every theorem

toolchain:
  lean: leanprover/lean4:v4.35.0
  mathlib: v4.35.0

imports:
  - Mathlib

conventions:
  - "ℤ[√p] is Mathlib's Zsqrtd (p : ℤ). Polynomials are Mathlib's Polynomial; X is Polynomial.X and C is Polynomial.C."
  - "The field with p elements is ZMod p. Groups are written multiplicatively, with the class Group, and their order is Nat.card."
  - "The prime p is a natural number with p.Prime."
  - "Use the keyword theorem for every claim, inside namespace Ladder."

assumptions: []            # nothing may be assumed: every claim is proved in full

not_in_mathlib:
  - "a ready-made classification of the groups of order 21, to our knowledge"

forbidden:
  - "sorry, admit, axiom, native_decide, decide +native"
  - "changing the definitions or the pinned statement"
  - "adding a hypothesis to a theorem"

budget:
  max_attempts: 8
  max_seconds_per_build: 600
  max_heartbeats: 400000
