# The training ladder, rung 4 of 5: master's.
#
# The ladder is a progression of classic exercises, from A-level to PhD, for the
# book's chapter on learning Lean 4. Every statement below was written by the
# platform's build thread and has NOT been reviewed by a person. No solution is
# kept here: a proof enters the repository through the gate, from a real run.
#
# The context pack for this rung is context.yaml, next to this file.

id = "training-4-masters"
title = "Training ladder, rung 4 (master's): three Diophantine classics"
source = "Classic exercises; folklore. Chosen for the book's Lean 4 training chapter on 17 November 2026."
status = "known"
imports = ["Mathlib"]

informal = '''
Three classic results of a master's course in number theory, each a Diophantine equation, each the standard example of a method: Fermat's descent, the two-squares theorem, and unique factorisation in `\mathbb{Z}[\sqrt{-2}]`$. They are independent of each other. Mathlib is imported. It holds the first two in some form; to our knowledge it does not hold the third.
'''

[document]
kind = "exercise"

[[steps]]
id = "fermat_four"
part = "(a)"
informal = "Fermat's last theorem for exponent 4: the equation `x^4 + y^4 = z^4`$ has no solution in integers with `x`$ and `y`$ non-zero."
theorem = "Ladder.fermat_four"
signature = "(x y z : ℤ) (hx : x ≠ 0) (hy : y ≠ 0) : x ^ 4 + y ^ 4 ≠ z ^ 4"
formalised_by = "Claude, in the platform build thread, 17 November 2026"
reviewed_by = ""

[[steps]]
id = "two_squares"
part = "(b)"
informal = "Fermat's two-squares theorem: a prime `p \\equiv 1 \\pmod{4}`$ is a sum of two squares."
theorem = "Ladder.two_squares"
signature = "(p : ℕ) (hp : p.Prime) (h : p % 4 = 1) : ∃ a b : ℕ, a ^ 2 + b ^ 2 = p"
formalised_by = "Claude, in the platform build thread, 17 November 2026"
reviewed_by = ""

[[steps]]
id = "mordell"
part = "(c)"
informal = "The only integer solutions of `y^2 = x^3 - 2`$ are `(x, y) = (3, 5)`$ and `(3, -5)`$."
theorem = "Ladder.mordell_minus_two"
signature = "(x y : ℤ) (h : y ^ 2 = x ^ 3 - 2) : x = 3 ∧ (y = 5 ∨ y = -5)"
formalised_by = "Claude, in the platform build thread, 17 November 2026"
reviewed_by = ""
