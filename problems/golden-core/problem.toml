# The golden set, core Lean: five small results nobody doubts, each with a
# reference proof in golden/golden-core/ that the gate accepts.
#
# It is the canary for Stage 0. If the pipeline cannot prove these, the fault is
# in the platform, the prompt or the model, and no new document should be run
# until it is found. Two of the five are traps: natural-number subtraction and
# division do not behave like their real-number namesakes.

id = "golden-core"
title = "Golden set, core Lean: five small known results"
source = "Written for the platform on 14 and 15 November 2026. Elementary folklore."
status = "known"
imports = []

informal = """
Five independent warm-up statements about natural numbers. Each is elementary and
well known. They share nothing except the definitions below.
"""

preamble = """
/-- The sum of the first `n` odd numbers: `1 + 3 + ... + (2n - 1)`. -/
def sumOdds : Nat → Nat
  | 0 => 0
  | n + 1 => sumOdds n + (2 * n + 1)

/-- `isQR p a` is true when `a` is a non-zero square modulo `p`, found by trying every `x < p`. -/
def isQR (p a : Nat) : Bool :=
  a % p != 0 && (List.range p).any fun x => x * x % p == a % p

/-- Quadratic residues minus non-residues modulo `p` among `1, 2, ..., (p - 1) / 2`. -/
def residueExcess (p : Nat) : Int :=
  ((List.range ((p - 1) / 2)).map fun i => if isQR p (i + 1) then (1 : Int) else -1).sum
"""

[document]
kind = "note"

[[steps]]
id = "sum_odds"
part = "(1)"
informal = "For every natural number `n`$, the sum of the first `n`$ odd numbers is `n^2`$: `1 + 3 + \\cdots + (2n - 1) = n^2`$."
theorem = "sum_odds_eq_sq"
signature = "(n : Nat) : sumOdds n = n ^ 2"
formalised_by = "Claude, in the platform build thread, 14 November 2026"
reviewed_by = ""

[[steps]]
id = "consecutive_even"
part = "(2)"
informal = "The product of two consecutive natural numbers is even: `2 \\mid n(n+1)`$ for every natural number `n`$."
theorem = "consecutive_product_even"
signature = "(n : Nat) : n * (n + 1) % 2 = 0"
formalised_by = "Claude, in the platform build thread, 14 November 2026"
reviewed_by = ""

[[steps]]
id = "excess_23"
part = "(3)"
informal = "Among `1, 2, \\ldots, 11`$ there are exactly three more quadratic residues modulo `23`$ than non-residues."
theorem = "residue_excess_23"
signature = ": residueExcess 23 = 3"
formalised_by = "Claude, in the platform build thread, 14 November 2026"
reviewed_by = ""

[[steps]]
id = "sub_add_cancel"
part = "(4)"
informal = "For natural numbers `a`$ and `b`$ with `b \\le a`$, `(a - b) + b = a`$. Without the hypothesis the claim is false in Lean, where subtraction of natural numbers stops at zero."
theorem = "sub_add_cancel_of_le"
signature = "(a b : Nat) (h : b ≤ a) : a - b + b = a"
formalised_by = "Claude, in the platform build thread, 15 November 2026"
reviewed_by = ""

[[steps]]
id = "half_double_le"
part = "(5)"
informal = "For every natural number `n`$, `2 \\lfloor n/2 \\rfloor \\le n`$, and equality fails exactly when `n`$ is odd. Only the inequality is to be proved."
theorem = "half_double_le"
signature = "(n : Nat) : n / 2 * 2 ≤ n"
formalised_by = "Claude, in the platform build thread, 15 November 2026"
reviewed_by = ""
