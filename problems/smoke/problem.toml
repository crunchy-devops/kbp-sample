# Smoke test: three results nobody doubts, in core Lean, so that a failure here
# is the platform's fault and not the mathematics'. Not part of the book's
# worked case; it exists to prove the plumbing.

id = "smoke"
title = "Platform smoke test: three small known results"
source = "Written for the platform on 14 November 2026. Elementary folklore."
status = "known"
imports = []

informal = """
Three independent warm-up statements about natural numbers. Each is elementary and
well known. They share nothing except the definitions below.
"""

preamble = """
/-- The sum of the first `n` odd numbers: `1 + 3 + ... + (2n - 1)`. -/
def sumOdds : Nat → Nat
  | 0 => 0
  | n + 1 => sumOdds n + (2 * n + 1)

/-- `isQR p a` is true when `a` is a non-zero square modulo `p`, found by trying every `x < p`. -/
def isQR (p a : Nat) : Bool :=
  a % p != 0 && (List.range p).any fun x => x * x % p == a % p

/-- Quadratic residues minus non-residues modulo `p` among `1, 2, ..., (p - 1) / 2`. -/
def residueExcess (p : Nat) : Int :=
  ((List.range ((p - 1) / 2)).map fun i => if isQR p (i + 1) then (1 : Int) else -1).sum
"""

[document]
kind = "note"

[[steps]]
id = "sum_odds"
part = "(1)"
informal = "For every natural number `n`$, the sum of the first `n`$ odd numbers is `n^2`$: `1 + 3 + \\cdots + (2n - 1) = n^2`$."
theorem = "sum_odds_eq_sq"
signature = "(n : Nat) : sumOdds n = n ^ 2"
formalised_by = "Claude, in the platform build thread, 14 November 2026"
reviewed_by = ""

[[steps]]
id = "consecutive_even"
part = "(2)"
informal = "The product of two consecutive natural numbers is even: `2 \\mid n(n+1)`$ for every natural number `n`$."
theorem = "consecutive_product_even"
signature = "(n : Nat) : n * (n + 1) % 2 = 0"
formalised_by = "Claude, in the platform build thread, 14 November 2026"
reviewed_by = ""

[[steps]]
id = "excess_23"
part = "(3)"
informal = "Among `1, 2, \\ldots, 11`$ there are exactly three more quadratic residues modulo `23`$ than non-residues."
theorem = "residue_excess_23"
signature = ": residueExcess 23 = 3"
formalised_by = "Claude, in the platform build thread, 14 November 2026"
reviewed_by = ""
